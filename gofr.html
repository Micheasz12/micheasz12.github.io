<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: white;
        }
    </style>
</head>

<body>

    <model-viewer
        id="model"
        src="test.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral">

    </model-viewer>

    <script>
        const model = document.getElementById("model");

        model.addEventListener("load", () => {
            if (model.canActivateAR) {
                model.activateAR();
            }
        });
    </script>

</body>
</html>
