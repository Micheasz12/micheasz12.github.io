<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #ffffff;
      }
      #viewer {
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      #viewer:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

      const container = document.getElementById('viewer');

      // Scena 3D
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      // Kamera
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );
      camera.position.set(0, 0, 5);

      // Renderer WebGL
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // Kontrola przesuwania i obracania (mysz / dotyk)
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = true;
      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN,
      };

      // Oświetlenie sceny
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xf5f5f5, 1.2);
      hemiLight.position.set(0, 50, 0);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight2.position.set(-5, 5, -5);
      scene.add(dirLight2);

      // Wczytywanie pliku test.glb
      let currentModel = null;
      const loader = new GLTFLoader();
      loader.load(
        '/test.glb',
        (gltf) => {
          currentModel = gltf.scene;

          // Wyśrodkowanie i automatyczne dopasowanie kamery do rozmiarów modelu
          const box = new THREE.Box3().setFromObject(currentModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          currentModel.position.x -= center.x;
          currentModel.position.y -= center.y;
          currentModel.position.z -= center.z;

          scene.add(currentModel);

          const maxDim = Math.max(size.x, size.y, size.z);
          const fov = camera.fov * (Math.PI / 180);
          let cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
          cameraDistance = Math.max(cameraDistance * 1.6, 2);

          camera.position.set(cameraDistance * 0.8, cameraDistance * 0.5, cameraDistance);
          camera.near = cameraDistance / 100;
          camera.far = cameraDistance * 100;
          camera.updateProjectionMatrix();

          controls.target.set(0, 0, 0);
          controls.maxDistance = cameraDistance * 10;
          controls.minDistance = cameraDistance * 0.05;
          controls.update();
        },
        undefined,
        (error) => {
          console.error('Błąd ładowania pliku /test.glb:', error);
        }
      );

      // Pętla animacji
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Obsługa zmiany rozmiaru okna
      window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
