<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>MENU | Restauracja</title>

  <!-- Czcionki -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: #f6f6f6;
      color: #444;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65);
      transform: scale(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 20px;
      letter-spacing: 7px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      max-width: 850px;
      margin: 0 auto;
      padding: 55px 20px 100px;
    }

    .category {
      margin-bottom: 100px;
    }

    .category-title {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 500;
      color: #555;
      margin-bottom: 55px;
      text-transform: uppercase;
    }

    /* =========================
       DANIE
    ========================= */

    .dish {
      max-width: 600px;
      margin: 0 auto 60px;

      display: grid;
      grid-template-columns: 1fr 150px;
      align-items: center;
      gap: 35px;

      cursor: pointer;

      transition: transform 0.25s ease;
    }

    .dish:hover {
      transform: translateY(-3px);
    }

    .dish.reverse {
      grid-template-columns: 150px 1fr;
    }

    .dish.reverse .dish-image {
      order: 1;
    }

    .dish.reverse .dish-info {
      order: 2;
      text-align: left;
    }

    /* =========================
       ZDJĘCIE
    ========================= */

    .dish-image {
      width: 150px;
      height: 150px;
      overflow: hidden;
      background: #eee;
    }

    .dish-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: transform 0.4s ease;
    }

    .dish:hover .dish-image img {
      transform: scale(1.06);
    }

    /* =========================
       TEKST
    ========================= */

    .dish-info {
      text-align: right;
    }

    .dish-name {
      font-family: "Playfair Display", serif;
      font-size: 16px;
      color: #333;
      margin-bottom: 9px;
      font-weight: 500;
    }

    .dish-description {
      font-size: 10px;
      line-height: 1.7;
      color: #888;
      margin-bottom: 12px;
    }

    .dish-price {
      font-size: 11px;
      color: #555;
      font-weight: 600;
    }

    .dish-icons {
      margin-top: 12px;

      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .dish.reverse .dish-icons {
      justify-content: flex-start;
    }

    .mini-icon {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #d8a15a;
      color: white;

      font-size: 8px;
    }

    /* =========================
       KOSZYK
    ========================= */

    .cart-button {
      position: fixed;
      bottom: 25px;
      right: 25px;

      width: 58px;
      height: 58px;

      border-radius: 50%;
      border: none;

      background: #222;
      color: white;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;

      box-shadow: 0 10px 30px rgba(0,0,0,0.25);

      z-index: 100;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;

      width: 20px;
      height: 20px;

      background: #c68a3b;
      color: white;

      border-radius: 50%;

      font-size: 10px;
      font-weight: bold;

      display: none;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.65);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 200;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;

      max-height: 92vh;

      overflow-y: auto;

      background: white;

      position: relative;

      box-shadow: 0 30px 100px rgba(0,0,0,0.35);
    }

    .close-button {
      position: absolute;
      right: 15px;
      top: 15px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: none;

      background: white;
      color: #333;

      font-size: 20px;

      cursor: pointer;

      z-index: 20;

      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    /* =========================
       MODAL HERO
    ========================= */

    .modal-visual {
      width: 100%;
      height: 340px;

      background: #eeeeee;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .modal-image-container {
      width: 100%;
      height: 100%;
    }

    .modal-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    model-viewer {
      width: 100%;
      height: 100%;

      background: linear-gradient(
        180deg,
        #eeeeee,
        #dddddd
      );
    }

    /* =========================
       3D BUTTON
    ========================= */

    .show-3d-button {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: #222;
      color: white;

      padding: 13px 24px;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;

      z-index: 10;

      white-space: nowrap;
    }

    .ar-button {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: #c68a3b;
      color: white;

      padding: 14px 25px;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;

      white-space: nowrap;

      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* =========================
       MODAL INFO
    ========================= */

    .modal-content {
      padding: 35px;
    }

    .modal-title {
      font-family: "Playfair Display", serif;
      font-size: 28px;

      color: #222;

      margin-bottom: 15px;
    }

    .modal-description {
      font-size: 12px;
      line-height: 1.8;

      color: #777;

      margin-bottom: 25px;
    }

    .modal-price {
      font-size: 20px;
      font-weight: 600;

      margin-bottom: 25px;
    }

    .ingredients-title {
      font-size: 11px;
      letter-spacing: 2px;

      margin-bottom: 12px;

      color: #444;
    }

    .ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 30px;
    }

    .ingredient {
      background: #f1f1f1;

      padding: 7px 10px;

      font-size: 10px;

      color: #666;
    }

    /* =========================
       QUANTITY
    ========================= */

    .order-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .quantity {
      display: flex;
      align-items: center;

      border: 1px solid #ddd;
    }

    .quantity button {
      width: 38px;
      height: 42px;

      border: none;

      background: white;

      cursor: pointer;

      font-size: 18px;
    }

    .quantity span {
      width: 35px;

      text-align: center;

      font-size: 13px;
    }

    .add-button {
      flex: 1;

      height: 42px;

      border: none;

      background: #222;

      color: white;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;
    }

    /* =========================
       CART DRAWER
    ========================= */

    .cart-drawer {
      position: fixed;

      top: 0;
      right: -450px;

      width: 100%;
      max-width: 420px;

      height: 100vh;

      background: white;

      z-index: 300;

      transition: right 0.35s ease;

      box-shadow: -10px 0 50px rgba(0,0,0,0.15);

      display: flex;
      flex-direction: column;
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-header {
      padding: 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid #eee;
    }

    .cart-header h2 {
      font-family: "Playfair Display", serif;

      font-size: 24px;

      font-weight: 500;
    }

    .cart-close {
      border: none;

      background: none;

      font-size: 24px;

      cursor: pointer;
    }

    .cart-items {
      flex: 1;

      overflow-y: auto;

      padding: 20px;
    }

    .cart-item {
      display: flex;

      gap: 12px;

      margin-bottom: 18px;

      padding-bottom: 18px;

      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 60px;
      height: 60px;

      object-fit: cover;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 12px;
      font-weight: 600;

      margin-bottom: 5px;
    }

    .cart-item-price {
      font-size: 11px;
      color: #888;
    }

    .cart-footer {
      padding: 25px;

      border-top: 1px solid #eee;
    }

    .cart-total {
      display: flex;

      justify-content: space-between;

      font-size: 18px;

      margin-bottom: 20px;
    }

    .order-button {
      width: 100%;

      border: none;

      background: #222;
      color: white;

      height: 50px;

      cursor: pointer;

      letter-spacing: 1px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        height: 190px;
      }

      .hero h1 {
        font-size: 16px;
      }

      .menu {
        padding: 45px 18px 90px;
      }

      .category {
        margin-bottom: 75px;
      }

      .category-title {
        margin-bottom: 40px;
        font-size: 11px;
      }

      .dish {
        grid-template-columns: 1fr 115px;

        gap: 16px;

        margin-bottom: 40px;
      }

      .dish.reverse {
        grid-template-columns: 115px 1fr;
      }

      .dish-image {
        width: 115px;
        height: 115px;
      }

      .dish-name {
        font-size: 13px;
      }

      .dish-description {
        font-size: 8px;
        line-height: 1.6;
      }

      .dish-price {
        font-size: 9px;
      }

      .modal-content {
        padding: 25px;
      }

      .modal-visual {
        height: 280px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HERO
========================= -->

<header class="hero">

  <img
    src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1800&q=90"
    alt="Restauracja"
  >

  <div class="hero-overlay">

    <h1>MENU</h1>

    <p>THE GOLDEN OAK RESTAURANT</p>

  </div>

</header>

</main>


<!-- =========================
     CART BUTTON
========================= -->

  onclick="openCart()"
>

  🛒

    id="cartCount"
    class="cart-count"
  >
    0
  </span>

</button>


<!-- =========================
     DISH MODAL
========================= -->

<div
  id="dishModal"
  class="modal"
>

  <div class="modal-box">

    <button
      class="close-button"
      onclick="closeDishModal()"
    >
      ×
    </button>


    <!-- IMAGE / MODEL -->

    <div class="modal-visual">


      <!-- IMAGE -->

      <div
        id="modalImageContainer"
        class="modal-image-container"
      >

        <img
          id="modalDishImg"
          src=""
          alt=""
        >

      </div>


      <!-- MODEL 3D -->

      <model-viewer

        id="dish3DModel"

        style="display:none;"

        src=""

        alt="Model 3D dania"

        camera-controls

        auto-rotate

        shadow-intensity="1"

        exposure="1"

        ar

        ar-modes="webxr scene-viewer quick-look"

        ar-placement="floor"

      >

        <button
          slot="ar-button"
          class="ar-button"
        >
          📱 Zobacz na swoim stole
        </button>

      </model-viewer>


      <!-- SHOW 3D -->

      <button
        id="show3DButton"
        class="show-3d-button"
        style="display:none;"
        onclick="showDish3D()"
      >

        ✨ ZOBACZ DANIE W 3D

      </button>


    </div>


    <!-- CONTENT -->

    <div class="modal-content">

      <h2
        id="modalDishTitle"
        class="modal-title"
      >
      </h2>


      <p
        id="modalDishDescription"
        class="modal-description"
      >
      </p>


      <div
        id="modalDishPrice"
        class="modal-price"
      >
      </div>


      <div class="ingredients-title">

        SKŁADNIKI

      </div>


      <div
        id="modalIngredients"
        class="ingredients"
      >
      </div>


      <!-- QUANTITY -->

      <div class="order-row">

        <div class="quantity">

          <button
            onclick="changeQuantity(-1)"
          >
            −
          </button>


          <span
            id="modalQuantity"
          >
            1
          </span>


          <button
            onclick="changeQuantity(1)"
          >
            +
          </button>

        </div>


        <button
          class="add-button"
          onclick="addCurrentDishToCart()"
        >

          DODAJ DO ZAMÓWIENIA

        </button>

      </div>


    </div>

  </div>

</div>


<!-- =========================
     CART DRAWER
========================= -->

<div
  id="cartDrawer"
  class="cart-drawer"
>

  <div class="cart-header">

    <h2>Twoje zamówienie</h2>

    <button
      class="cart-close"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-items"
  >
  </div>


  <div class="cart-footer">

    <div class="cart-total">

      <span>Razem</span>

      <strong
        id="cartTotal"
      >
        0.00 zł
      </strong>

    </div>


    <button
      class="order-button"
      onclick="submitOrder()"
    >

      ZŁÓŻ ZAMÓWIENIE

    </button>

  </div>

</div>

      "Czekolada",
      "Masło",
      "Wanilia",
      "Jajka"
    ]

  }


];



/* =========================================
   STATE
========================================= */

let activeDish = null;

let quantity = 1;

let cart = [];



/* =========================================
   RENDER MENU
========================================= */

function renderMenu() {

  const container =
    document.getElementById("menuContainer");


  container.innerHTML =
    CATEGORIES.map(category => {


      const categoryDishes =
        DISHES.filter(
          dish =>
            dish.categoryId === category.id
        );


      return `

        <section class="category">

          <h2 class="category-title">

            ${category.name}

          </h2>


          ${categoryDishes.map((dish, index) => {


            const reverse =
              index % 2 === 1
                ? "reverse"
                : "";


            const hasModel =
              dish.model
                ? `<div class="mini-icon">3D</div>`
                : "";


            return `

              <article

                class="dish ${reverse}"

                onclick="openDishModal('${dish.id}')"

              >


                <div class="dish-info">


                  <h3 class="dish-name">

                    ${dish.name}

                  </h3>


                  <p class="dish-description">

                    ${dish.description}

                  </p>


                  <div class="dish-price">

                    ${dish.price.toFixed(2)} zł

                  </div>


                  <div class="dish-icons">

                    ${hasModel}

                    <div class="mini-icon">

                      🍽

                    </div>

                  </div>


                </div>


                <div class="dish-image">

                  <img

                    src="${dish.image}"

                    alt="${dish.name}"

                    loading="lazy"

                  >

                </div>


              </article>

            `;

          }).join("")}


        </section>

      `;

    }).join("");

}



/* =========================================
   OPEN DISH
========================================= */

function openDishModal(id) {


  const dish =
    DISHES.find(
      d => d.id === id
    );


  if (!dish) return;


  activeDish = dish;

  quantity = 1;


  document.getElementById(
    "modalQuantity"
  ).textContent = quantity;


  /* =========================
     IMAGE
  ========================= */

  document.getElementById(
    "modalDishImg"
  ).src = dish.image;


  document.getElementById(
    "modalDishTitle"
  ).textContent = dish.name;


  document.getElementById(
    "modalDishDescription"
  ).textContent = dish.description;


  document.getElementById(
    "modalDishPrice"
  ).textContent =
    dish.price.toFixed(2) + " zł";


  /* =========================
     INGREDIENTS
  ========================= */

  document.getElementById(
    "modalIngredients"
  ).innerHTML =
    dish.ingredients.map(

      ingredient =>

        `<span class="ingredient">

          ${ingredient}

        </span>`

    ).join("");


  /* =========================
     MODEL
  ========================= */

  const modelViewer =
    document.getElementById(
      "dish3DModel"
    );


  const show3DButton =
    document.getElementById(
      "show3DButton"
    );


  const imageContainer =
    document.getElementById(
      "modalImageContainer"
    );


  /* Zawsze zaczynamy od zdjęcia */

  imageContainer.style.display = "block";

  modelViewer.style.display = "none";


  if (dish.model) {


    modelViewer.src =
      dish.model;


    show3DButton.style.display =
      "block";


  } else {


    show3DButton.style.display =
      "none";


    modelViewer.removeAttribute(
      "src"
    );


  }


  /* OPEN */

  document.getElementById(
    "dishModal"
  ).classList.add(
    "active"
  );


}



/* =========================================
   SHOW 3D
========================================= */

function showDish3D() {


  const modelViewer =
    document.getElementById(
      "dish3DModel"
    );


  const imageContainer =
    document.getElementById(
      "modalImageContainer"
    );


  const show3DButton =
    document.getElementById(
      "show3DButton"
    );


  imageContainer.style.display =
    "none";


  modelViewer.style.display =
    "block";


  show3DButton.style.display =
    "none";


}



/* =========================================
   CLOSE MODAL
========================================= */

function closeDishModal() {


  document.getElementById(
    "dishModal"
  ).classList.remove(
    "active"
  );


}



/* =========================================
   QUANTITY
========================================= */

function changeQuantity(change) {


  quantity += change;


  if (quantity < 1) {

    quantity = 1;

  }


  document.getElementById(
    "modalQuantity"
  ).textContent =
    quantity;


}



/* =========================================
   ADD TO CART
========================================= */

function addCurrentDishToCart() {


  if (!activeDish) return;


  const existing =
    cart.find(
      item =>
        item.dish.id === activeDish.id
    );


  if (existing) {


    existing.quantity += quantity;


  } else {


    cart.push({

      dish: activeDish,

      quantity: quantity

    });


  }


  updateCart();


  closeDishModal();


}



/* =========================================
   UPDATE CART
========================================= */

function updateCart() {


  const count =
    cart.reduce(

      (total, item) =>
        total + item.quantity,

      0

    );


  const badge =
    document.getElementById(
      "cartCount"
    );


  if (count > 0) {


    badge.style.display =
      "flex";


    badge.textContent =
      count;


  } else {


    badge.style.display =
      "none";


  }


  renderCart();


}



/* =========================================
   OPEN CART
========================================= */

function openCart() {


  document.getElementById(
    "cartDrawer"
  ).classList.add(
    "active"
  );


}



/* =========================================
   CLOSE CART
========================================= */

function closeCart() {


  document.getElementById(
    "cartDrawer"
  ).classList.remove(
    "active"
  );


}



/* =========================================
   RENDER CART
========================================= */

function renderCart() {


  const container =
    document.getElementById(
      "cartItems"
    );


  if (cart.length === 0) {


    container.innerHTML = `

      <p
        style="
          text-align:center;
          color:#999;
          margin-top:50px;
          font-size:12px;
        "
      >

        Twój koszyk jest pusty.

      </p>

    `;


    document.getElementById(
      "cartTotal"
    ).textContent =
      "0.00 zł";


    return;

  }


  container.innerHTML =
    cart.map((item, index) => {


      return `

        <div class="cart-item">


          <img
            src="${item.dish.image}"
            alt="${item.dish.name}"
          >


          <div class="cart-item-info">


            <div class="cart-item-name">

              ${item.dish.name}

            </div>


            <div class="cart-item-price">

              ${item.quantity}
              ×
              ${item.dish.price.toFixed(2)} zł

            </div>


            <div
              style="
                margin-top:8px;
                display:flex;
                gap:5px;
              "
            >


              <button

                onclick="
                  changeCartQuantity(
                    ${index},
                    -1
                  )
                "

                style="
                  width:25px;
                  height:25px;
                  border:1px solid #ddd;
                  background:white;
                  cursor:pointer;
                "

              >

                −

              </button>


              <button

                onclick="
                  changeCartQuantity(
                    ${index},
                    1
                  )
                "

                style="
                  width:25px;
                  height:25px;
                  border:1px solid #ddd;
                  background:white;
                  cursor:pointer;
                "

              >

                +

              </button>


            </div>


          </div>


        </div>

      `;

    }).join("");


  const total =
    cart.reduce(

      (sum, item) =>

        sum +
        (
          item.dish.price *
          item.quantity
        ),

      0

    );


  document.getElementById(
    "cartTotal"
  ).textContent =
    total.toFixed(2) + " zł";


}



/* =========================================
   CHANGE CART QUANTITY
========================================= */

function changeCartQuantity(
  index,
  change
) {


  cart[index].quantity +=
    change;


  if (
    cart[index].quantity <= 0
  ) {


    cart.splice(
      index,
      1
    );


  }


  updateCart();


}



/* =========================================
   SUBMIT ORDER
========================================= */

function submitOrder() {


  if (cart.length === 0) {


    alert(
      "Koszyk jest pusty."
    );


    return;

  }


  alert(
    "Zamówienie zostało wysłane do kuchni!"
  );


  cart = [];


  updateCart();


  closeCart();


}



/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

document
  .getElementById(
    "dishModal"
  )
  .addEventListener(
    "click",

    function(event) {


      if (
        event.target === this
      ) {


        closeDishModal();


      }


    }

  );



/* =========================================
   START
========================================= */

renderMenu();


</script>


</body>
</html>
