<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>MENU | Restauracja</title>

  <!-- Czcionki -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: #f6f6f6;
      color: #444;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.65);
      transform: scale(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 20px;
      letter-spacing: 7px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 9px;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    /* =========================
       MENU
    ========================= */

    .menu {
      max-width: 850px;
      margin: 0 auto;
      padding: 55px 20px 100px;
    }

    .category {
      margin-bottom: 100px;
    }

    .category-title {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 500;
      color: #555;
      margin-bottom: 55px;
      text-transform: uppercase;
    }

    /* =========================
       DANIE
    ========================= */

    .dish {
      max-width: 600px;
      margin: 0 auto 60px;

      display: grid;
      grid-template-columns: 1fr 150px;
      align-items: center;
      gap: 35px;

      cursor: pointer;

      transition: transform 0.25s ease;
    }

    .dish:hover {
      transform: translateY(-3px);
    }

    .dish.reverse {
      grid-template-columns: 150px 1fr;
    }

    .dish.reverse .dish-image {
      order: 1;
    }

    .dish.reverse .dish-info {
      order: 2;
      text-align: left;
    }

    /* =========================
       ZDJĘCIE
    ========================= */

    .dish-image {
      width: 150px;
      height: 150px;
      overflow: hidden;
      background: #eee;
    }

    .dish-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: transform 0.4s ease;
    }

    .dish:hover .dish-image img {
      transform: scale(1.06);
    }

    /* =========================
       TEKST
    ========================= */

    .dish-info {
      text-align: right;
    }

    .dish-name {
      font-family: "Playfair Display", serif;
      font-size: 16px;
      color: #333;
      margin-bottom: 9px;
      font-weight: 500;
    }

    .dish-description {
      font-size: 10px;
      line-height: 1.7;
      color: #888;
      margin-bottom: 12px;
    }

    .dish-price {
      font-size: 11px;
      color: #555;
      font-weight: 600;
    }

    .dish-icons {
      margin-top: 12px;

      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .dish.reverse .dish-icons {
      justify-content: flex-start;
    }

    .mini-icon {
      width: 22px;
      height: 22px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #d8a15a;
      color: white;

      font-size: 8px;
      font-weight: 600;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.65);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 200;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;

      max-height: 92vh;

      overflow-y: auto;

      background: white;

      position: relative;

      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.35);
    }

    .close-button {
      position: absolute;
      right: 15px;
      top: 15px;

      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: none;

      background: white;
      color: #333;

      font-size: 20px;

      cursor: pointer;

      z-index: 20;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    /* =========================
       MODAL VISUAL
    ========================= */

    .modal-visual {
      width: 100%;
      height: 340px;

      background: #eeeeee;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .modal-image-container {
      width: 100%;
      height: 100%;
    }

    .modal-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    model-viewer {
      width: 100%;
      height: 100%;

      background: linear-gradient(
        180deg,
        #eeeeee,
        #dddddd
      );
    }

    /* =========================
       3D / AR BUTTON
    ========================= */

    .show-3d-button {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: #222;
      color: white;

      padding: 13px 24px;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;

      z-index: 10;

      white-space: nowrap;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

      transition: background 0.25s ease;
    }

    .show-3d-button:hover {
      background: #c68a3b;
    }

    .ar-button {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: #c68a3b;
      color: white;

      padding: 14px 25px;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;

      white-space: nowrap;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* =========================
       MODAL INFO
    ========================= */

    .modal-content {
      padding: 35px;
    }

    .modal-title {
      font-family: "Playfair Display", serif;
      font-size: 28px;

      color: #222;

      margin-bottom: 15px;
    }

    .modal-description {
      font-size: 12px;
      line-height: 1.8;

      color: #777;

      margin-bottom: 25px;
    }

    .modal-price {
      font-size: 20px;
      font-weight: 600;

      margin-bottom: 25px;
    }

    .ingredients-title {
      font-size: 11px;
      letter-spacing: 2px;

      margin-bottom: 12px;

      color: #444;
    }

    .ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 10px;
    }

    .ingredient {
      background: #f1f1f1;

      padding: 7px 10px;

      font-size: 10px;

      color: #666;
    }

    /* =========================
       3D INFO
    ========================= */

    .model-info {
      margin-top: 25px;

      padding: 16px;

      background: #f7f3ed;

      border-left: 3px solid #c68a3b;

      font-size: 10px;

      line-height: 1.7;

      color: #777;
    }

    .model-info strong {
      color: #444;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        height: 190px;
      }

      .hero h1 {
        font-size: 16px;
      }

      .menu {
        padding: 45px 18px 90px;
      }

      .category {
        margin-bottom: 75px;
      }

      .category-title {
        margin-bottom: 40px;
        font-size: 11px;
      }

      .dish {
        grid-template-columns: 1fr 115px;

        gap: 16px;

        margin-bottom: 40px;
      }

      .dish.reverse {
        grid-template-columns: 115px 1fr;
      }

      .dish-image {
        width: 115px;
        height: 115px;
      }

      .dish-name {
        font-size: 13px;
      }

      .dish-description {
        font-size: 8px;
        line-height: 1.6;
      }

      .dish-price {
        font-size: 9px;
      }

      .modal-content {
        padding: 25px;
      }

      .modal-visual {
        height: 280px;
      }

      .modal-title {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HERO
========================= -->

<header class="hero">

  <img
    src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1800&q=90"

  >

  <div class="hero-overlay">

    <h1>MENU</h1>

  </div>

<!-- =========================

========================= -->

<!-- =========================
     DISH MODAL
========================= -->

<div

  class="modal"
>

      onclick="closeDishModal()"

    </button>


    <!-- =========================
         IMAGE / MODEL 3D
    ========================= -->

    <div class="modal-visual">


      <!-- ZDJĘCIE -->

      <div
        id="modalImageContainer"
        class="modal-image-container"
      >

        <img
          id="modalDishImg"
          src=""
          alt=""
        >

      </div>


      <!-- MODEL 3D + AR -->

      <model-viewer

        id="dish3DModel"

        style="display:none;"

        src=""

        alt="Model 3D dania"

        camera-controls

        auto-rotate

        shadow-intensity="1"

        exposure="1"

        ar

        ar-modes="webxr scene-viewer quick-look"

        ar-placement="floor"

      >

        <button
          slot="ar-button"
          class="ar-button"
        >
          📱 ZOBACZ NA SWOIM STOLE
        </button>

      </model-viewer>


      <!-- PRZYCISK POKAZANIA 3D -->

      <button
        id="show3DButton"
        class="show-3d-button"
        style="display:none;"
        onclick="showDish3D()"
      >
        ✨ ZOBACZ DANIE W 3D
      </button>


    </div>


    <!-- =========================
         CONTENT
    ========================= -->

    <div class="modal-content">

      <h2
        id="modalDishTitle"
        class="modal-title"
      >
      </h2>


      <p
        id="modalDishDescription"
        class="modal-description"
      >
      </p>


      <div
        id="modalDishPrice"
        class="modal-price"
      >
      </div>


      <div class="ingredients-title">
        SKŁADNIKI
      </div>


      <div
        id="modalIngredients"
        class="ingredients"
      >
      </div>


      <!-- INFORMACJA O 3D -->

      <div
        id="modelInfo"
        class="model-info"
        style="display:none;"
      >
        <strong>WIZUALIZACJA 3D / AR</strong><br>
        Obracaj danie palcem lub myszką, aby zobaczyć je z każdej strony.
        Na obsługiwanych urządzeniach możesz również wyświetlić danie
        w swojej przestrzeni dzięki technologii AR.
      </div>

    </div>

  </div>

</div>

/* =========================================
   STATE
========================================= */

let activeDish = null;



/* =========================================
   RENDER MENU
========================================= */

function renderMenu() {

  const container =
    document.getElementById("menuContainer");


  container.innerHTML =
    CATEGORIES.map(category => {


      const categoryDishes =
        DISHES.filter(
          dish =>
            dish.categoryId === category.id
        );


      return `

        <section class="category">

          <h2 class="category-title">

            ${category.name}

          </h2>


          ${categoryDishes.map((dish, index) => {


            const reverse =
              index % 2 === 1
                ? "reverse"
                : "";


            const hasModel =
              dish.model
                ? `
                    <div
                      class="mini-icon"
                      title="Dostępne 3D / AR"
                    >
                      3D
                    </div>
                  `
                : "";


            return `

              <article

                class="dish ${reverse}"

                onclick="openDishModal('${dish.id}')"

              >


                <div class="dish-info">


                  <h3 class="dish-name">

                    ${dish.name}

                  </h3>


                  <p class="dish-description">

                    ${dish.description}

                  </p>


                  <div class="dish-price">

                    ${dish.price.toFixed(2)} zł

                  </div>


                  <div class="dish-icons">

                    ${hasModel}

                    <div
                      class="mini-icon"
                      title="Opis dania"
                    >
                      🍽
                    </div>

                  </div>


                </div>


                <div class="dish-image">

                  <img

                    src="${dish.image}"

                    alt="${dish.name}"

                    loading="lazy"

                  >

                </div>


              </article>

            `;

          }).join("")}


        </section>

      `;

    }).join("");

}



/* =========================================
   OPEN DISH
========================================= */

function openDishModal(id) {


  const dish =
    DISHES.find(
      d => d.id === id
    );


  if (!dish) return;


  activeDish = dish;


  /* =========================
     IMAGE
  ========================= */

  document.getElementById(
    "modalDishImg"
  ).src = dish.image;


  document.getElementById(
    "modalDishImg"
  ).alt = dish.name;


  document.getElementById(
    "modalDishTitle"
  ).textContent = dish.name;


  document.getElementById(
    "modalDishDescription"
  ).textContent = dish.description;


  document.getElementById(
    "modalDishPrice"
  ).textContent =
    dish.price.toFixed(2) + " zł";


  /* =========================
     INGREDIENTS
  ========================= */

  document.getElementById(
    "modalIngredients"
  ).innerHTML =
    dish.ingredients.map(

      ingredient =>

        `<span class="ingredient">

          ${ingredient}

        </span>`

    ).join("");


  /* =========================
     MODEL 3D
  ========================= */

  const modelViewer =
    document.getElementById(
      "dish3DModel"
    );


  const show3DButton =
    document.getElementById(
      "show3DButton"
    );


  const imageContainer =
    document.getElementById(
      "modalImageContainer"
    );


  const modelInfo =
    document.getElementById(
      "modelInfo"
    );


  /*
     Zawsze zaczynamy od zdjęcia.
  */

  imageContainer.style.display =
    "block";


  modelViewer.style.display =
    "none";


  if (dish.model) {

    /*
       Ustawienie modelu konkretnego dania.
    */

    modelViewer.src =
      dish.model;


    show3DButton.style.display =
      "block";


    modelInfo.style.display =
      "block";


  } else {

    /*
       Jeśli danie nie ma modelu,
       nie pokazujemy funkcji 3D.
    */

    show3DButton.style.display =
      "none";


    modelInfo.style.display =
      "none";


    modelViewer.removeAttribute(
      "src"
    );

  }


  /* =========================
     OPEN MODAL
  ========================= */

  document.getElementById(
    "dishModal"
  ).classList.add(
    "active"
  );


}



/* =========================================
   SHOW 3D
========================================= */

function showDish3D() {


  if (!activeDish || !activeDish.model) {
    return;
  }


  const modelViewer =
    document.getElementById(
      "dish3DModel"
    );


  const imageContainer =
    document.getElementById(
      "modalImageContainer"
    );


  const show3DButton =
    document.getElementById(
      "show3DButton"
    );


  /*
     Ukryj zdjęcie.
  */

  imageContainer.style.display =
    "none";


  /*
     Pokaż model 3D.
  */

  modelViewer.style.display =
    "block";


  /*
     Ukryj przycisk.
  */

  show3DButton.style.display =
    "none";

}



/* =========================================
   CLOSE MODAL
========================================= */

function closeDishModal() {


  const modal =
    document.getElementById(
      "dishModal"
    );


  modal.classList.remove(
    "active"
  );


  /*
     Po zamknięciu modal wraca
     do zdjęcia przy kolejnym otwarciu.
  */

  const modelViewer =
    document.getElementById(
      "dish3DModel"
    );


  const imageContainer =
    document.getElementById(
      "modalImageContainer"
    );


  const show3DButton =
    document.getElementById(
      "show3DButton"
    );


  imageContainer.style.display =
    "block";


  if (activeDish && activeDish.model) {

    show3DButton.style.display =
      "block";

  }


  modelViewer.style.display =
    "none";

}



/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

document
  .getElementById("dishModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeDishModal();

      }

    }
  );



/* =========================================
   ESC = CLOSE MODAL
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeDishModal();

    }

  }
);



/* =========================================
   START
========================================= */

renderMenu();


</script>


</body>
</html>
