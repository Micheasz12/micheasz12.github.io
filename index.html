<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>MENU | Restauracja</title>

  <!-- =========================
       CZCIONKI
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- =========================
       MODEL VIEWER
  ========================= -->

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>


  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: #f6f6f6;
      color: #444;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      width: 100%;
      height: 260px;

      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      filter: brightness(0.65);

      transform: scale(1.02);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background: rgba(0, 0, 0, 0.18);

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      color: white;

      text-align: center;
    }

    .hero h1 {
      font-size: 20px;

      letter-spacing: 7px;

      font-weight: 400;

      margin-bottom: 12px;
    }

    .hero p {
      font-size: 9px;

      letter-spacing: 3px;

      opacity: 0.9;
    }


    /* =========================
       MENU
    ========================= */

    .menu {
      max-width: 850px;

      margin: 0 auto;

      padding: 55px 20px 100px;
    }

    .category {
      margin-bottom: 100px;
    }

    .category-title {
      text-align: center;

      font-size: 13px;

      letter-spacing: 3px;

      font-weight: 500;

      color: #555;

      margin-bottom: 55px;

      text-transform: uppercase;
    }


    /* =========================
       DANIE
    ========================= */

    .dish {
      max-width: 600px;

      margin: 0 auto 60px;

      display: grid;

      grid-template-columns: 1fr 150px;

      align-items: center;

      gap: 35px;

      transition: transform 0.25s ease;
    }

    .dish:hover {
      transform: translateY(-3px);
    }

    .dish.reverse {
      grid-template-columns: 150px 1fr;
    }

    .dish.reverse .dish-image {
      order: 1;
    }

    .dish.reverse .dish-info {
      order: 2;

      text-align: left;
    }


    /* =========================
       ZDJĘCIE
    ========================= */

    .dish-image {
      width: 150px;
      height: 150px;

      overflow: hidden;

      background: #eee;
    }

    .dish-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform 0.4s ease;
    }

    .dish:hover .dish-image img {
      transform: scale(1.06);
    }


    /* =========================
       INFORMACJE
    ========================= */

    .dish-info {
      text-align: right;
    }

    .dish-name {
      font-family: "Playfair Display", serif;

      font-size: 16px;

      color: #333;

      margin-bottom: 9px;

      font-weight: 500;
    }

    .dish-description {
      font-size: 10px;

      line-height: 1.7;

      color: #888;

      margin-bottom: 12px;
    }

    .dish-price {
      font-size: 11px;

      color: #555;

      font-weight: 600;

      margin-bottom: 13px;
    }


    /* =========================
       PRZYCISK 3D / AR
    ========================= */

    .dish-3d-button {
      border: none;

      background: #222;

      color: white;

      padding: 10px 16px;

      font-size: 9px;

      letter-spacing: 1px;

      cursor: pointer;

      transition:
        background 0.25s ease,
        transform 0.25s ease;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;
    }

    .dish-3d-button:hover {
      background: #c68a3b;

      transform: translateY(-2px);
    }

    .dish.reverse .dish-3d-button {
      margin-left: 0;
    }


    /* =========================
       BRAK 3D
    ========================= */

    .no-3d {
      font-size: 8px;

      color: #aaa;

      letter-spacing: 1px;
    }


    /* =========================
       3D / AR FULLSCREEN
    ========================= */

    .ar-viewer {
      position: fixed;

      inset: 0;

      background: #eeeeee;

      z-index: 9999;

      display: none;
    }

    .ar-viewer.active {
      display: block;
    }

    .ar-viewer model-viewer {
      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          #eeeeee,
          #dddddd
        );
    }


    /* =========================
       GÓRNY PANEL 3D
    ========================= */

    .viewer-header {
      position: absolute;

      top: 20px;
      left: 20px;
      right: 20px;

      z-index: 20;

      display: flex;

      align-items: center;

      justify-content: space-between;

      pointer-events: none;
    }

    .viewer-title {
      background: rgba(255, 255, 255, 0.94);

      padding: 12px 18px;

      font-family: "Playfair Display", serif;

      font-size: 18px;

      color: #222;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.12);

      pointer-events: auto;
    }


    /* =========================
       ZAMKNIĘCIE 3D
    ========================= */

    .viewer-close {
      width: 45px;
      height: 45px;

      border: none;

      border-radius: 50%;

      background: white;

      color: #222;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.18);

      pointer-events: auto;
    }


    /* =========================
       AR BUTTON
    ========================= */

    .ar-button {
      position: absolute;

      bottom: 30px;

      left: 50%;

      transform: translateX(-50%);

      border: none;

      background: #c68a3b;

      color: white;

      padding: 15px 25px;

      font-size: 11px;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);

      white-space: nowrap;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        height: 190px;
      }

      .hero h1 {
        font-size: 16px;
      }

      .menu {
        padding: 45px 18px 90px;
      }

      .category {
        margin-bottom: 75px;
      }

      .category-title {
        margin-bottom: 40px;

        font-size: 11px;
      }

      .dish {
        grid-template-columns: 1fr 115px;

        gap: 16px;

        margin-bottom: 40px;
      }

      .dish.reverse {
        grid-template-columns: 115px 1fr;
      }

      .dish-image {
        width: 115px;
        height: 115px;
      }

      .dish-name {
        font-size: 13px;
      }

      .dish-description {
        font-size: 8px;

        line-height: 1.6;
      }

      .dish-price {
        font-size: 9px;
      }

      .dish-3d-button {
        padding: 9px 12px;

        font-size: 8px;
      }

      .viewer-title {
        font-size: 15px;

        padding: 10px 14px;
      }

      .viewer-close {
        width: 40px;
        height: 40px;
      }

      .ar-button {
        bottom: 20px;

        font-size: 10px;

        padding: 13px 20px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     HERO
========================= -->

<header class="hero">

  <img
    src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1800&q=90"
    alt="Restauracja"
  >

  <div class="hero-overlay">

    <h1>MENU</h1>

    <p>THE GOLDEN OAK RESTAURANT</p>

  </div>

</header>


<!-- =========================
     MENU
========================= -->

<main class="menu">

  <div id="menuContainer"></div>

</main>


<!-- =========================
     PEŁNOEKRANOWY VIEWER 3D / AR
========================= -->

<div
  id="arViewer"
  class="ar-viewer"
>

  <!-- GÓRNY PANEL -->

  <div class="viewer-header">

    <div
      id="viewerTitle"
      class="viewer-title"
    >
      Danie
    </div>

    <button
      class="viewer-close"
      onclick="close3DViewer()"
      aria-label="Zamknij"
    >
      ×
    </button>

  </div>


  <!-- MODEL -->

  <model-viewer

    id="mainModelViewer"

    src=""

    alt="Model 3D dania"

    camera-controls

    auto-rotate

    shadow-intensity="1"

    exposure="1"

    ar

    ar-modes="webxr scene-viewer quick-look"

    ar-placement="floor"

  >

    <!--

      Ten przycisk jest używany przez Model Viewer
      jako natywny przycisk uruchomienia AR.

    -->

    <button
      slot="ar-button"
      class="ar-button"
    >
      📱 ZOBACZ NA SWOIM STOLE
    </button>

  </model-viewer>

</div>

/* =========================================
   RENDER MENU
========================================= */

function renderMenu() {

  const container =
    document.getElementById(
      "menuContainer"
    );


  container.innerHTML =
    CATEGORIES.map(category => {


      const categoryDishes =
        DISHES.filter(
          dish =>
            dish.categoryId === category.id
        );


      return `

        <section class="category">

          <h2 class="category-title">
            ${category.name}
          </h2>


          ${categoryDishes.map(
            (dish, index) => {


              const reverse =
                index % 2 === 1
                  ? "reverse"
                  : "";


              /*
                Jeśli danie ma model GLB,
                pokazujemy przycisk 3D / AR.
              */

              const modelButton =
                dish.model
                  ? `

                    <button

                      class="dish-3d-button"

                      onclick="
                        event.stopPropagation();
                        open3DViewer(
                          '${dish.id}'
                        );
                      "

                    >

                      ✨ 3D / AR

                    </button>

                  `
                  : `

                    <span class="no-3d">
                      WIZUALIZACJA 3D NIEDOSTĘPNA
                    </span>

                  `;


              return `

                <article
                  class="dish ${reverse}"
                >

                  <!-- =====================
                       INFORMACJE
                  ===================== -->

                  <div class="dish-info">

                    <h3 class="dish-name">
                      ${dish.name}
                    </h3>


                    <p class="dish-description">
                      ${dish.description}
                    </p>


                    <div class="dish-price">
                      ${dish.price.toFixed(2)} zł
                    </div>


                    ${modelButton}

                  </div>


                  <!-- =====================
                       ZDJĘCIE
                  ===================== -->

                  <div class="dish-image">

                    <img

                      src="${dish.image}"

                      alt="${dish.name}"

                      loading="lazy"

                    >

                  </div>

                </article>

              `;

            }
          ).join("")}

        </section>

      `;

    }).join("");

}



/* =========================================
   OPEN 3D / AR
========================================= */

function open3DViewer(id) {

  const dish =
    DISHES.find(
      item =>
        item.id === id
    );


  if (!dish) {
    return;
  }


  if (!dish.model) {
    return;
  }


  const viewer =
    document.getElementById(
      "mainModelViewer"
    );


  const viewerContainer =
    document.getElementById(
      "arViewer"
    );


  const title =
    document.getElementById(
      "viewerTitle"
    );


  /*
    Ustawienie odpowiedniego modelu GLB.
  */

  viewer.src =
    dish.model;


  viewer.alt =
    `Model 3D - ${dish.name}`;


  /*
    Zmiana nazwy dania
    w górnym panelu.
  */

  title.textContent =
    dish.name;


  /*
    Otwórz pełnoekranowy viewer.
  */

  viewerContainer.classList.add(
    "active"
  );


  /*
    Zablokuj przewijanie strony
    podczas oglądania modelu.
  */

  document.body.style.overflow =
    "hidden";

}



/* =========================================
   CLOSE 3D VIEWER
========================================= */

function close3DViewer() {

  const viewerContainer =
    document.getElementById(
      "arViewer"
    );


  const viewer =
    document.getElementById(
      "mainModelViewer"
    );


  viewerContainer.classList.remove(
    "active"
  );


  /*
    Usunięcie modelu po zamknięciu.
  */

  viewer.removeAttribute(
    "src"
  );


  /*
    Przywrócenie przewijania strony.
  */

  document.body.style.overflow =
    "";

}



/* =========================================
   ESC = CLOSE 3D
========================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      close3DViewer();

    }

  }
);



/* =========================================
   START
========================================= */

renderMenu();


</script>
