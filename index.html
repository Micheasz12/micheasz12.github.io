<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Burger AR</title>

  <!-- Google Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1eb;
      color: #222;
    }

    .header {
      padding: 25px 20px 10px;
      text-align: center;
    }

    .restaurant {
      font-size: 14px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      margin: 8px 0;
      font-size: 32px;
    }

    .card {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    model-viewer {
      width: 100%;
      height: 450px;
      background: #eee;
    }

    .info {
      padding: 25px;
    }

    .name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .ar-button {
      background: #111;
      color: white;
      border: none;
      width: 100%;
      padding: 17px;
      border-radius: 14px;
      font-size: 17px;
      cursor: pointer;
    }

    .ar-button:hover {
      background: #333;
    }

    @media (max-width: 600px) {
      .card {
        margin: 10px;
      }

      model-viewer {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="restaurant">RESTAURACJA XYZ</div>
    <h1>Nasze menu</h1>
  </div>

  <div class="card">

    <model-viewer
      src="./burger.glb"
      alt="Burger Classic"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1">

      <button
        class="ar-button"
        slot="ar-button">
        📱 Zobacz na swoim stole
      </button>

    </model-viewer>

    <div class="info">

      <div class="name">
        Burger Classic
      </div>

      <div class="description">
        Wołowina, cheddar, sałata, pomidor,
        cebula i sos naszego szefa kuchni.
      </div>

      <div class="price">
        39 zł
      </div>

    </div>

  </div>

</body>
</html>
